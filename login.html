<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Quiz Platform</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<header class="navbar">
    <a class="brand" href="index.html">
        <span>🎓</span> Quiz Platform
    </a>

    <nav>
        <a href="index1.html">الرئيسية</a>
        <a href="subjects.html">المواد الدراسية</a>
        <a href="quiz.html">الاختبارات</a>
        <a href="ranking.html">ترتيب الطلاب</a>
        <a class="active" href="login.html">حسابي</a>
        <a href="add_question.html">إضافة سؤال</a>
    </nav>
</header>

<main>

    <section class="panel">

        <div class="heading">
            <h2>تسجيل الدخول</h2>
            <span>♟</span>
        </div>

        <form id="loginForm">

            <label for="email">
                البريد الإلكتروني:
            </label>

            <div class="input-wrap">
                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                >
                <span>✉</span>
            </div>

            <label for="password">
                كلمة المرور:
            </label>

            <div class="input-wrap">
                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                                    >
                <span>✉</span>

            </div>
            <button class="button wide" type="submit"> تسجيل الدخول</button>
            <p id="loginResult" class="result"></p>
        </form>
    </section>
</main>
<footer>

</footer>

</body>
</html>
